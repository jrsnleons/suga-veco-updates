name: Scrape VECO Facebook Advisories

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: veco-scraper
  cancel-in-progress: true

jobs:
  scrape-and-sync:
    name: Scrape VECO Facebook Updates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium with system dependencies
        run: npx patchright install chromium --with-deps

      - name: Run Scraper and Sync to Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          echo "Starting VECO Facebook Scrape & Turso Sync..."
          npm run scrape || {
            echo "Scrape returned non-zero, running live feed fallback..."
            npm run import-live
          }
