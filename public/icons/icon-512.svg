<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="50%" stop-color="#0e0e10"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="zapGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
  
  <!-- Outer pulse ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#007AFF" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 12"/>
  
  <!-- Glow surge -->
  <polygon points="280,90 150,278 252,278 232,422 362,234 260,234" fill="url(#zapGrad512)" filter="url(#glow512)" opacity="0.45"/>
  
  <!-- Main surge bolt -->
  <polygon points="280,90 150,278 252,278 232,422 362,234 260,234" fill="url(#zapGrad512)"/>
</svg>
