<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="zapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Outer pulse ring -->
  <circle cx="96" cy="96" r="64" fill="none" stroke="#007AFF" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 6"/>
  
  <!-- Glow surge -->
  <polygon points="106,34 56,104 94,104 86,158 136,88 98,88" fill="url(#zapGrad)" filter="url(#glow)" opacity="0.4"/>
  
  <!-- Main surge bolt -->
  <polygon points="106,34 56,104 94,104 86,158 136,88 98,88" fill="url(#zapGrad)"/>
</svg>
